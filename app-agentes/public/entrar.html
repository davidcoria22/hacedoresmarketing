<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar · Hacedores</title>
  <link rel="icon" type="image/jpeg" href="icono-hacedores.jpg">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif; color: #1F1F1E; background: linear-gradient(135deg, #F1EFEA 0%, #FCEFF1 55%, #F8D3DC 100%); }
    .tarjeta { width: min(420px, 100%); background: rgba(255, 255, 255, .8); border-radius: 32px; padding: 36px 32px; text-align: center; box-shadow: 0 20px 60px rgba(60, 30, 40, .12); }
    .logo { display: block; width: 210px; max-width: 80%; height: auto; margin: 0 auto 26px; }
    h1 { margin: 0 0 8px; font-size: 26px; font-weight: 400; }
    p { margin: 0 0 24px; color: #5F5E5A; font-size: 14px; line-height: 1.5; }
    .google { display: inline-flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px 20px; border-radius: 999px; background: #2B2B2A; color: #fff; text-decoration: none; font-size: 15px; transition: transform .15s, background .15s; }
    .google:hover { background: #e72c5e; transform: translateY(-1px); }
    .google:focus-visible { outline: 3px solid #e72c5e; outline-offset: 3px; }
    .google svg { background: #fff; border-radius: 50%; padding: 4px; flex: none; }
    .aviso { margin: 0 0 18px; padding: 12px 16px; border-radius: 18px; background: #FCE3EA; color: #B3173F; font-size: 13.5px; line-height: 1.45; }
    .aviso[hidden] { display: none; }
    small { display: block; margin-top: 20px; color: #5F5E5A; font-size: 12px; }
  </style>
</head>
<body>
  <main class="tarjeta">
    <img class="logo" src="logo-hacedores.png" alt="Hacedores">
    <h1>Panel de agentes</h1>
    <p>Acceso solo para el equipo de Hacedores. Entra con tu cuenta de Google.</p>
    <div class="aviso" id="aviso" role="alert" hidden></div>
    <a class="google" href="/api/auth/google">
      <svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Entrar con Google
    </a>
    <small>Si tu cuenta no tiene acceso, pide que la agreguen.</small>
  </main>
  <script>
    const mensajes = {
      cuenta: 'Esa cuenta de Google no tiene acceso al panel. Entra con una cuenta autorizada.',
      cancelado: 'Cancelaste el inicio de sesión. Puedes intentarlo de nuevo.',
      fallo: 'No se pudo completar el inicio de sesión. Inténtalo de nuevo.',
      sin_configurar: 'El acceso con Google todavía no está configurado en este sitio.',
    };
    const codigo = new URLSearchParams(location.search).get('error');
    if (codigo) { const a = document.getElementById('aviso'); a.textContent = mensajes[codigo] || mensajes.fallo; a.hidden = false; }
  </script>
</body>
</html>
